name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持手动点击按钮打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create Android wrapper if needed
        run: flutter create . --platforms=android

      - name: Build APK
        run: flutter build apk --split-per-abi=false --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidNotes-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
